name: Footera POTM portraits
on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/potm-portraits.yml'
      - 'scripts/import-potm-portraits.py'
      - 'scripts/potm-portraits.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import missing POTM portraits
        run: |
          python -m pip install Pillow
          python scripts/import-potm-portraits.py
      - name: Commit portraits to this branch
        run: |
          git config user.name 'Footera Asset Bot'
          git config user.email 'footera-assets@users.noreply.github.com'
          git add assets/footera/events/potm
          git diff --cached --quiet && exit 0
          git commit -m 'assets(potm): POTM portraits [skip ci]'
          git push origin HEAD:"${GITHUB_REF_NAME}"
