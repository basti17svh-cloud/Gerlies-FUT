name: Probe player sources (temporary)
on:
  push:
    branches: ['claude/project-thread-ua1lks']
    paths: ['scripts/probe-player-sources.cjs','.github/workflows/probe-player-sources.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/probe-player-sources.cjs
