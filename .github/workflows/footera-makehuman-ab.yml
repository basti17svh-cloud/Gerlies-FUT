name: Footera MakeHuman Experimental Diagnostic
on:
  push:
    paths:
      - '3d-player-prototype.mjs'
      - '3d-highlights-scene.mjs'
      - '3d-highlights.js'
      - 'makehuman-vergleich.html'
      - 'tests/makehuman-comparison.browser.cjs'
      - '.github/workflows/footera-makehuman-ab.yml'
      - 'assets/footera/models/makehuman-male.glb'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-player:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Footera model rig, clip and material regression tests
        run: node --test tests/3d-player-retarget.test.cjs tests/3d-glb-motion.test.cjs tests/3d-glb-clip-blend.test.cjs tests/player-pbr.test.cjs
      - name: Install actual mobile Chromium/WebGL renderer
        run: |
          npm install --prefix /tmp/footera-model-ab playwright@1.51.1
          /tmp/footera-model-ab/node_modules/.bin/playwright install --with-deps chromium
      - name: Genuine same-frame game screenshot and mobile width validation
        env:
          NODE_PATH: /tmp/footera-model-ab/node_modules
        run: node tests/makehuman-comparison.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footera-makehuman-quarantined-screens
          path: test-artifacts/makehuman-ab/
          if-no-files-found: warn
