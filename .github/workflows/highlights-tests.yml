name: Footera 3D Highlights
on:
  pull_request:
    paths: ['3d-highlights*', 'vendor/three/**', 'tests/3d-highlights*', 'index.html', 'matchday.css', 'service-worker.js', 'champions-system.js', 'play-hub.js', 'play-hub.css', 'club-stats.js', 'club-identity.css', 'tests/club-identity*', 'manifest.webmanifest', 'tests/champions*', 'tests/matchday*', 'tests/prematch-editor*', 'tests/player-profile.test.cjs', 'tests/playstyles.test.cjs', 'tests/chem-boosts.test.cjs', '.github/workflows/highlights-tests.yml']
  push:
    branches: [main]
    paths: ['3d-highlights*', 'vendor/three/**', 'tests/3d-highlights*', 'index.html', 'matchday.css', 'service-worker.js', 'champions-system.js', 'play-hub.js', 'play-hub.css', 'club-stats.js', 'club-identity.css', 'tests/club-identity*', 'manifest.webmanifest', 'tests/champions*', 'tests/matchday*', 'tests/prematch-editor*', 'tests/player-profile.test.cjs', 'tests/playstyles.test.cjs', 'tests/chem-boosts.test.cjs', '.github/workflows/highlights-tests.yml']
permissions:
  contents: read
jobs:
  highlights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation, queue, cards, chemistry and PlayStyles regressions
        run: node --test tests/3d-highlights.test.cjs tests/matchday.test.cjs tests/chem-boosts.test.cjs tests/playstyles.test.cjs tests/card-layout.test.cjs tests/player-profile.test.cjs tests/boot-update.test.cjs tests/champions.test.cjs tests/club-identity.test.cjs
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix /tmp/footera-browser playwright@1.51.1
          /tmp/footera-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Real WebGL and mobile matchflow tests
        env:
          NODE_PATH: /tmp/footera-browser/node_modules
        run: |
          node tests/3d-highlights.browser.cjs
          node tests/champions.browser.cjs
          node tests/matchday-manager.browser.cjs
          node tests/prematch-editor.browser.cjs
          node tests/3d-highlights.render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footera-3d-mobile-evidence
          path: test-artifacts/
          retention-days: 7
