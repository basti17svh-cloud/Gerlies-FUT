name: Footera Player Abilities
on:
  push:
    branches: [main, 'codex/player-abilities-*']
    paths: ['3d-skill-actions.mjs', '3d-playbook.mjs', '3d-highlights*', '3d-player-prototype.mjs', 'footera-match-actions.js', 'footera-app.js', 'tests/player-abilities*', '.github/workflows/player-abilities.yml']
  pull_request:
    paths: ['3d-skill-actions.mjs', 'tests/player-abilities*', '.github/workflows/player-abilities.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Foot, skill, choreography and projection regressions
        run: |
          node --test tests/player-abilities.test.cjs tests/match-actions.test.cjs tests/playbook-variation.test.cjs tests/playstyle-signature.test.cjs
          node --test --test-name-pattern='V21.303' tests/match-simulation.test.cjs
      - name: Install isolated WebGL test runtime
        run: |
          npm install --prefix /tmp/footera-abilities playwright@1.51.1
          /tmp/footera-abilities/node_modules/.bin/playwright install --with-deps chromium
      - name: Both production rigs and feet at 360, 390 and 412 pixels
        env:
          NODE_PATH: /tmp/footera-abilities/node_modules
        run: node tests/player-abilities.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footera-player-abilities-v21303
          path: test-artifacts/player-abilities-v21303/
          retention-days: 7
