name: Serie C squads from Wikipedia
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/serie-c-collect.cjs','scripts/serie-c-clubs.json','.github/workflows/serie-c-collect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/serie-c-collect.cjs
