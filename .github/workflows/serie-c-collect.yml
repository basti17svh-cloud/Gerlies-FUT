name: Serie C squads from Wikipedia
# Run by hand when the squads change (e.g. after the January transfer window), copy the SC| lines into
# data/serie-c-squads.json and run: node scripts/build-serie-c.cjs --merge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/serie-c-collect.cjs
