name: Footera scan dynamic pictures
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/scan-dynamic-candidates.py', '.github/workflows/scan-dynamic-candidates.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/scan-dynamic-candidates.py
      - name: Commit candidate list
        run: |
          git config user.name 'Footera Asset Bot'
          git config user.email 'footera-assets@users.noreply.github.com'
          git add scripts/dynamic-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: players with EA dynamic pictures [skip ci]'
          git push origin HEAD:"${GITHUB_REF_NAME}"
