name: Footera Weekly Rewards
on:
  push:
    branches: [main]
    paths:
      - 'weekly-rewards.js'
      - 'weekly-rewards.css'
      - 'tests/weekly-rewards.test.cjs'
      - 'tests/competition-system.test.cjs'
      - 'tests/champions.test.cjs'
      - 'tests/champions-points*'
      - 'tests/promo-packs-release.test.cjs'
      - 'pack-odds.js'
      - 'pack-odds-ui.js'
      - 'pack-odds.css'
      - 'tests/pack-odds.test.cjs'
      - 'tests/footera-store.test.cjs'
      - 'footera-backup.js'
      - 'footera-opponent-styles.js'
      - 'tests/footera-backup.test.cjs'
      - 'tests/save-durability.test.cjs'
      - 'tests/footera-opponent-styles.test.cjs'
      - 'tests/footera-opponent-balancing.test.cjs'
      - '.github/workflows/weekly-rewards-tests.yml'
      - 'index.html'
      - 'footera-app.css'
      - 'footera-app.js'
      - 'tests/helpers/**'
      - 'competition-system.js'
      - 'champions-system.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
  pull_request:
    paths:
      - 'weekly-rewards.js'
      - 'weekly-rewards.css'
      - 'tests/weekly-rewards.test.cjs'
      - 'tests/competition-system.test.cjs'
      - 'tests/champions.test.cjs'
      - 'tests/champions-points*'
      - 'tests/promo-packs-release.test.cjs'
      - 'pack-odds.js'
      - 'pack-odds-ui.js'
      - 'pack-odds.css'
      - 'tests/pack-odds.test.cjs'
      - 'tests/footera-store.test.cjs'
      - 'footera-backup.js'
      - 'footera-opponent-styles.js'
      - 'tests/footera-backup.test.cjs'
      - 'tests/save-durability.test.cjs'
      - 'tests/footera-opponent-styles.test.cjs'
      - 'tests/footera-opponent-balancing.test.cjs'
      - '.github/workflows/weekly-rewards-tests.yml'
      - 'index.html'
      - 'footera-app.css'
      - 'footera-app.js'
      - 'tests/helpers/**'
      - 'competition-system.js'
      - 'champions-system.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
permissions:
  contents: read
jobs:
  weekly-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reward UI, ranks, week resets, claims and update regression tests
        run: node --test tests/save-durability.test.cjs tests/weekly-rewards.test.cjs tests/competition-system.test.cjs tests/champions.test.cjs tests/boot-update.test.cjs tests/content-drop-20261007.test.cjs tests/promo-packs-release.test.cjs
      - name: Pack chances, coin prices, and shop UI regressions
        run: |
          node --check pack-odds.js
          node --check pack-odds-ui.js
          node --test tests/pack-odds.test.cjs tests/footera-store.test.cjs tests/pack-pricing.test.cjs
      - name: Portable saves and CPU tactical identity regressions
        run: |
          node --check footera-backup.js
          node --check footera-opponent-styles.js
          node --test tests/footera-backup.test.cjs tests/footera-opponent-styles.test.cjs tests/footera-opponent-balancing.test.cjs

  champions-points:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/champions-points.test.cjs tests/weekly-rewards.test.cjs
      - name: Install mobile test browser
        run: |
          npm install --prefix /tmp/footera-browser playwright@1.51.1
          /tmp/footera-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Points preview, claim and reload at mobile widths
        env:
          NODE_PATH: /tmp/footera-browser/node_modules
        run: node tests/champions-points.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: champions-points-mobile
          path: test-artifacts/champions-points-*.png
          retention-days: 7
