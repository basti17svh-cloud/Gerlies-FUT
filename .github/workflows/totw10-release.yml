name: Prepare Best-of TOTW 10 release
on:
  push:
    branches: ['claude/project-thread-m6q31x']
    paths: ['.github/workflows/totw10-release.yml','scripts/totw10-week.json','scripts/totw-portraits-*.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import eighteen transparent portraits
        run: |
          python -m pip install Pillow
          python scripts/import-totw-portraits.py 10
      - name: Validate release rules and server catalog
        run: node --test tests/totw-rules.test.cjs tests/totw5-release.test.cjs tests/live-content.test.cjs tests/blackfriday-event.test.cjs
      - name: Install isolated browser
        run: |
          npm install --prefix /tmp/footera-totw-browser playwright@1.51.1
          /tmp/footera-totw-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Render the poster with the exact production cards
        env:
          NODE_PATH: /tmp/footera-totw-browser/node_modules
        run: test -s assets/footera/social/totw10-2026-11-18.png || node scripts/render-totw-poster.cjs 10 2026-11-18
      - name: Check TOTW 10 mobile preview and offline PWA
        env:
          NODE_PATH: /tmp/footera-totw-browser/node_modules
          TOTW_PREVIEW_WEEK: '10'
        run: node tests/totw5-preview.browser.cjs
      - name: Commit verified assets
        if: always()
        run: |
          git config user.name 'Footera Release Bot'
          git config user.email 'footera-assets@users.noreply.github.com'
          git add assets/footera/totw assets/footera/social/totw10-2026-11-18.png || true
          git diff --cached --quiet || { git commit -m 'TOTW 10 portraits and poster'; git push origin HEAD; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totw10-release-check
          path: test-artifacts/totw*-preview-*.png
