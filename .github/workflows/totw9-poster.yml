name: Footera TOTW 9 HD poster
on:
  push:
    branches: ['content/totw9-poster-20261111']
    paths: ['.github/workflows/totw9-poster.yml', 'scripts/prepare-totw9-poster.py']
permissions:
  contents: write
jobs:
  poster:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare approved roster
        run: python scripts/prepare-totw9-poster.py
      - name: Import genuine portraits
        run: |
          python -m pip install Pillow
          python scripts/import-totw-portraits.py 9
      - name: Install browser
        run: |
          npm install --prefix /tmp/footera-totw-browser playwright@1.51.1
          /tmp/footera-totw-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Render and validate HD poster
        env:
          NODE_PATH: /tmp/footera-totw-browser/node_modules
        run: |
          python - <<'PY'
          import pathlib
          p=pathlib.Path('scripts/render-totw-poster.cjs')
          s=p.read_text()
          assert 'deviceScaleFactor:2' in s
          p.write_text(s.replace('deviceScaleFactor:2','deviceScaleFactor:4'))
          PY
          node scripts/render-totw-poster.cjs 9 2026-11-11
          git restore scripts/render-totw-poster.cjs
          mkdir -p output
          python - <<'PY'
          from PIL import Image
          import shutil
          src='assets/footera/social/totw9-2026-11-11.png'
          im=Image.open(src)
          assert im.size==(4320,5400),im.size
          shutil.copyfile(src,'output/Footera-TOTW9-HD.png')
          im.resize((1080,1350),Image.Resampling.LANCZOS).convert('RGB').save('output/Footera-TOTW9-Vorschau.jpg',quality=92)
          print('Verified HD output:',im.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Footera-TOTW9-HD
          path: output/
      - name: Retain prepared poster on isolated branch
        run: |
          git config user.name 'Footera Asset Bot'
          git config user.email 'footera-assets@users.noreply.github.com'
          git add footera-app.js scripts/totw9-week.json scripts/totw-portraits-9.json assets/footera/totw/9 assets/footera/social/totw9-2026-11-11.png
          git commit -m 'Prepare TOTW 9 original cards and reviewed HD poster [skip ci]'
          git push origin HEAD
