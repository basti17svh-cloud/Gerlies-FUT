name: Social Tor der Woche 3D captures (temporary)
on:
  push:
    branches: ['claude/project-thread-hrz0aj']
    paths:
      - 'marketing-render-series/tdw-request.txt'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "matrix=$(jq -c . marketing-render-series/tdw-plan.json)" >> "$GITHUB_OUTPUT"
  capture:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/pc playwright@1.51.1
          /tmp/pc/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-inter ffmpeg
      - name: Capture
        env:
          NODE_PATH: /tmp/pc/node_modules
          NET_LIVE: '1'
          TYPE: goal
          SCORE: '0:0'
          XI: ${{ matrix.xi }}
          CLUB: ${{ toJSON(matrix.club) }}
        run: |
          node marketing-render-series/cap3d3.cjs /tmp/cap/${{ matrix.name }} ${{ matrix.from || '0.2' }} ${{ matrix.frames || '480' }} 30 432 home ${{ matrix.minute }} '${{ matrix.seq }}' '${{ matrix.who }}'
          mkdir -p out
          ffmpeg -y -loglevel error -framerate 30 -i /tmp/cap/${{ matrix.name }}/f%04d.jpg -vf 'scale=trunc(iw/2)*2:trunc(ih/2)*2' -c:v libx264 -crf 14 -preset slow -pix_fmt yuv420p out/${{ matrix.name }}.mp4
          cp /tmp/cap/${{ matrix.name }}/meta.json out/${{ matrix.name }}.json
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: tdw-${{ matrix.name }}
          path: out/
  commit:
    needs: capture
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/arts
      - name: Commit
        run: |
          mkdir -p marketing-render-series/tdw
          find /tmp/arts -type f \( -name '*.mp4' -o -name '*.json' \) -exec cp {} marketing-render-series/tdw/ \;
          git config user.name 'Footera Asset Bot'
          git config user.email 'footera-assets@users.noreply.github.com'
          git add marketing-render-series/tdw
          git diff --cached --quiet && exit 0
          git commit -m 'marketing: Tor der Woche 3D captures [skip ci]'
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break; sleep 5; done
