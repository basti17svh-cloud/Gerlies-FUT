name: Render social quiz video
on:
  push:
    branches: ['claude/project-thread-m6q31x']
    paths: ['marketing-quiz/request.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --prefix /tmp/quiz-browser playwright@1.51.1
          /tmp/quiz-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Render and encode
        env:
          NODE_PATH: /tmp/quiz-browser/node_modules
        run: |
          while read SCRIPT NAME; do
            [ -n "$SCRIPT" ] || continue
            rm -rf /tmp/quiz
            node "scripts/social/$SCRIPT" /tmp/quiz < /dev/null
            ffmpeg -y -loglevel error -framerate 30 -i /tmp/quiz/frames/%05d.jpg -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -movflags +faststart "marketing-quiz/$NAME-silent.mp4" < /dev/null
            cp /tmp/quiz/meta.json "marketing-quiz/$NAME-meta.json"
          done < marketing-quiz/request.txt
          ls -la marketing-quiz
      - name: Commit video
        run: |
          git config user.name 'Footera Release Bot'
          git config user.email 'footera-assets@users.noreply.github.com'
          git add marketing-quiz
          git commit -m 'Quiz video render [skip ci]'
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break; sleep 5; done
