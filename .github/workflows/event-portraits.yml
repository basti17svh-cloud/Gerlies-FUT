name: Footera event portraits
on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/event-portraits.yml'
      - 'scripts/import-event-portraits.py'
      - 'scripts/import-event-dynamic-images.py'
      - 'scripts/event-portraits-*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import transparent portraits for every event roster
        run: |
          python -m pip install Pillow
          for f in scripts/event-portraits-*.json; do
            e=$(basename "$f" .json); e=${e#event-portraits-}
            python scripts/import-event-portraits.py "$e"
            python scripts/import-event-dynamic-images.py "$e"
          done
      - name: Commit portraits to this branch
        run: |
          git config user.name 'Footera Asset Bot'
          git config user.email 'footera-assets@users.noreply.github.com'
          git add assets/footera/events
          git diff --cached --quiet && exit 0
          git commit -m 'assets(events): raw event portraits [skip ci]'
          git push origin HEAD:"${GITHUB_REF_NAME}"
