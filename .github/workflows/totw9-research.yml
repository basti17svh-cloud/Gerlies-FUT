name: TOTW 9 database research
on:
  push:
    branches: ['research/totw9-20261111']
    paths: ['.github/workflows/totw9-research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read candidate rows from current Footera database
        run: |
          python - <<'PY'
          import csv,json,unicodedata
          def key(s): return ''.join(c for c in unicodedata.normalize('NFD',s.lower()) if not unicodedata.combining(c)).replace('ø','o')
          rows=list(csv.DictReader(open('assets/players-db.csv')))
          out={}
          for q in ["Berger","Caprile","Kayla Sharples","Mittelstädt","Carlos Romero","Vušković","El Hilali","Peddemors","Kimmich","Arda Güler","Gruda","Fermín","Grønbæk","Shaw","Alessia Russo","Trinity Rodman","Liam Delap","Thierno Barry","Christian Pulisic"]:
           terms=key(q).split()
           hits=[r for r in rows if all(t in key(' '.join(v for k,v in r.items() if 'name' in k)) for t in terms)]
           out[q]=hits
          print('FOOTERA_CANDIDATE_ROWS_BEGIN')
          print(json.dumps(out,ensure_ascii=False))
          print('FOOTERA_CANDIDATE_ROWS_END')
          open('/tmp/totw9-rows.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: totw9-database-rows
          path: /tmp/totw9-rows.json
