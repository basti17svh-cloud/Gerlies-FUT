name: Redeploy Footera Stripe LIVE Edge Functions

# Manual operation only. This does not enable any LIVE payment release flags,
# issue a charge, touch player balances, or update the public game UI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: footera-live-stripe-redeploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: idxydyrihtyecvfjvtuk

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure deployment authentication is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure repository Actions secret SUPABASE_ACCESS_TOKEN before running this workflow."
            exit 1
          fi

      - name: Verify LIVE guardrails in source
        run: |
          node --test tests/footera-live-payments.test.cjs
          node - <<'JS'
          const fs = require('node:fs');
          const checkout = fs.readFileSync('online/footera-live-checkout.ts', 'utf8');
          const webhook = fs.readFileSync('online/footera-live-webhook.ts', 'utf8');
          for (const [name, source, flag] of [
            ['checkout', checkout, 'FOOTERA_LIVE_PAYMENTS_ENABLED'],
            ['webhook', webhook, 'FOOTERA_LIVE_WEBHOOK_ENABLED'],
          ]) {
            if (!source.includes('/^(?:sk|rk)_live_/.test(key)') || !source.includes(flag)) {
              throw Error(name + ' is missing restricted-LIVE-key or release gate safeguards');
            }
          }
          if (!webhook.includes('constructEventAsync') || !webhook.includes('stripe-signature')) {
            throw Error('Stripe signature verification is required for the webhook');
          }
          JS

      - name: Prepare function files from main
        run: |
          mkdir -p supabase/functions/footera-live-checkout
          mkdir -p supabase/functions/footera-live-webhook
          cp online/footera-live-checkout.ts supabase/functions/footera-live-checkout/index.ts
          cp online/footera-live-webhook.ts supabase/functions/footera-live-webhook/index.ts

      - name: Set up current Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy LIVE checkout (JWT required)
        run: |
          if ! supabase functions deploy footera-live-checkout \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --use-api; then
            echo "::warning::API bundling failed; trying Docker bundle."
            supabase functions deploy footera-live-checkout \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --use-docker
          fi

      - name: Deploy signed Stripe LIVE webhook (Stripe signature authentication)
        run: |
          if ! supabase functions deploy footera-live-webhook \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt \
              --use-api; then
            echo "::warning::API bundling failed; trying Docker bundle."
            supabase functions deploy footera-live-webhook \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt \
              --use-docker
          fi
