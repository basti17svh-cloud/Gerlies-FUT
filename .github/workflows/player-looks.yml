name: Footera player looks from EA portraits
on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/player-looks.yml'
      - 'scripts/build-player-looks.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-looks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/looks pngjs@7.0.0
      - name: Analyse EA portraits
        env:
          PNGJS: /tmp/looks/node_modules/pngjs
          SHEET: ${{ vars.LOOKS_SHEET || '' }}
        run: |
          if [ -f qa/looks-debug ]; then SHEET=$(cat qa/looks-debug) node scripts/build-player-looks.cjs; fi
          node scripts/build-player-looks.cjs
      - name: Commit results to this branch
        run: |
          git add -f assets/player-looks.json qa/looks-sheet.png qa/looks-sheet.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -m "Player looks: analyse EA portraits"
          git push origin HEAD:${GITHUB_REF_NAME}
