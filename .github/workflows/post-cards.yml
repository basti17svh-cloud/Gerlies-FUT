name: Footera post card renders
on:
  push:
    branches: ['claude/project-thread-orn9xt']
    paths:
      - 'marketing-render/request.txt'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/pc playwright@1.51.1
          /tmp/pc/node_modules/.bin/playwright install --with-deps chromium
      - name: Render cards
        env:
          NODE_PATH: /tmp/pc/node_modules
        run: |
          mkdir -p marketing-render/out
          O=marketing-render/out
          node scripts/render-post-cards.cjs $O 2026-10-30T19:30:00+01:00 team &
          node scripts/render-post-cards.cjs $O 2026-10-30T19:30:00+01:00 pass &
          node scripts/render-post-cards.cjs $O 2026-10-30T19:30:00+01:00 leao &
          node scripts/render-post-cards.cjs $O 2026-10-31T19:30:00+01:00 mueller &
          wait
          ls $O | wc -l
      - name: Commit renders
        run: |
          git config user.name 'Footera Asset Bot'
          git config user.email 'footera-assets@users.noreply.github.com'
          git add marketing-render/out
          git diff --cached --quiet && exit 0
          git commit -m 'marketing: post card renders [skip ci]'
          git push origin HEAD:"${GITHUB_REF_NAME}"
