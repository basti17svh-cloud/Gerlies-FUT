name: Supabase token check (read-only)
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-q7ikji]
    paths: ['.github/workflows/supabase-token-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Read project info via Management API (no changes)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::secret empty"; exit 1; fi
          code=$(curl -s -o out.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/idxydyrihtyecvfjvtuk/functions)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then head -c 300 out.json; exit 1; fi
          node -e 'const f=require("./out.json");console.log("functions:",f.length);for(const x of f)console.log(x.slug,"v"+x.version,x.status)'
