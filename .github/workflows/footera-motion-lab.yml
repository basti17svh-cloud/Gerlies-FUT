name: Footera Motion Lab Proof
on:
  push:
    branches: [main]
    paths:
      - 'motion-lab.html'
      - '3d-motion-lab.mjs'
      - '3d-action-continuity.mjs'
      - '3d-motion-2.mjs'
      - '3d-motion-transition.mjs'
      - '3d-motion-duels.mjs'
      - '3d-duel-contact.mjs'
      - '3d-highlights-scene.mjs'
      - 'tests/motion-lab.test.cjs'
      - 'tests/action-continuity.test.cjs'
      - 'tests/motion-2.test.cjs'
      - 'tests/motion-transitions.test.cjs'
      - 'tests/motion-duels.test.cjs'
      - 'tests/duel-contact.test.cjs'
      - 'tests/motion-lab.browser.cjs'
      - 'tests/motion-2.browser.cjs'
      - 'tests/motion-live.browser.cjs'
      - '3d-highlights.js'
      - 'service-worker.js'
      - 'index.html'
      - '.github/workflows/footera-motion-lab.yml'
  pull_request:
    paths:
      - 'motion-lab.html'
      - '3d-motion-lab.mjs'
      - '3d-action-continuity.mjs'
      - '3d-motion-2.mjs'
      - '3d-motion-transition.mjs'
      - '3d-motion-duels.mjs'
      - '3d-duel-contact.mjs'
      - '3d-highlights-scene.mjs'
      - 'tests/motion-lab.test.cjs'
      - 'tests/action-continuity.test.cjs'
      - 'tests/motion-2.test.cjs'
      - 'tests/motion-transitions.test.cjs'
      - 'tests/motion-duels.test.cjs'
      - 'tests/duel-contact.test.cjs'
      - 'tests/motion-lab.browser.cjs'
      - 'tests/motion-2.browser.cjs'
      - 'tests/motion-live.browser.cjs'
      - '3d-highlights.js'
      - 'service-worker.js'
      - 'index.html'
      - '.github/workflows/footera-motion-lab.yml'
permissions:
  contents: read
jobs:
  motion-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic cut, defender states, and unchanged shot handoff
        run: node --test tests/motion-lab.test.cjs tests/action-continuity.test.cjs tests/motion-2.test.cjs tests/motion-transitions.test.cjs tests/motion-duels.test.cjs tests/duel-contact.test.cjs
      - name: Install isolated browser renderer
        run: |
          npm install --prefix /tmp/footera-motion-lab playwright@1.51.1
          /tmp/footera-motion-lab/node_modules/.bin/playwright install --with-deps chromium
      - name: A/B screenshots at 390px and checks at 360/390/412px
        env:
          NODE_PATH: /tmp/footera-motion-lab/node_modules
        run: |
          node tests/motion-lab.browser.cjs
          node tests/motion-2.browser.cjs
          node tests/motion-live.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footera-motion-lab-ab-screens
          path: |
            test-artifacts/motion-lab-A.png
            test-artifacts/motion-lab-B.png
            test-artifacts/footera-slide-contact.webm
            test-artifacts/footera-slide-contact.mp4
            test-artifacts/footera-shot-block.webm
            test-artifacts/footera-shot-block.mp4
            test-artifacts/motion-contact-tackle-contact-result.png
            test-artifacts/motion-contact-blocked-shot-result.png
            test-artifacts/motion-contact-tackle-contact.png
            test-artifacts/motion-contact-blocked-shot.png
            test-artifacts/motion-26-jockey-right-old.png
            test-artifacts/motion-26-jockey-right-new.png
            test-artifacts/motion-26-jockey-left-old.png
            test-artifacts/motion-26-jockey-left-new.png
            test-artifacts/motion-26-block-old.png
            test-artifacts/motion-26-block-new.png
            test-artifacts/motion-26-recovery-old.png
            test-artifacts/motion-26-recovery-new.png
            test-artifacts/motion-26-shot-balance-old.png
            test-artifacts/motion-26-shot-balance-new.png
            test-artifacts/motion-23-brake-old.png
            test-artifacts/motion-23-brake-new.png
            test-artifacts/motion-23-launch-old.png
            test-artifacts/motion-23-launch-new.png
            test-artifacts/motion-23-receive-old.png
            test-artifacts/motion-23-receive-new.png
            test-artifacts/motion-22-first-touch-old.png
            test-artifacts/motion-22-first-touch-new.png
            test-artifacts/motion-22-far-corner-old.png
            test-artifacts/motion-22-far-corner-new.png
            test-artifacts/motion-2-old.webm
            test-artifacts/motion-2-new.webm
            test-artifacts/motion-2-old-cut.png
            test-artifacts/motion-2-old-shot.png
            test-artifacts/motion-2-cut.png
            test-artifacts/motion-2-shot.png
            test-artifacts/motion-21-cut_inside_left-old.png
            test-artifacts/motion-21-cut_inside_left-new.png
            test-artifacts/motion-21-double_feint_right-old.png
            test-artifacts/motion-21-double_feint_right-new.png
            test-artifacts/motion-21-double_feint_left-old.png
            test-artifacts/motion-21-double_feint_left-new.png
            test-artifacts/footera-v2145-live-motion.png
            test-artifacts/footera-v2145-live-football-actions.webm
          retention-days: 14
