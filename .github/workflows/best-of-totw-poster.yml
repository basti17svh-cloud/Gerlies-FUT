name: Footera Best of TOTW poster
on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/best-of-totw-poster.yml'
      - 'scripts/social/render-best-of-totw.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  poster:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm install --prefix /tmp/footera-poster-browser playwright@1.51.1
          /tmp/footera-poster-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Render the Best of TOTW poster
        env:
          NODE_PATH: /tmp/footera-poster-browser/node_modules
        run: node scripts/social/render-best-of-totw.cjs
      - name: Commit the poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/footera/social/best-of-totw
          git diff --cached --quiet || git commit -m "Best of TOTW poster"
          git push
