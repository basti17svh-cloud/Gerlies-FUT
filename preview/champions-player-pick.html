<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Footera · Champions Player Pick Vorschau</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f9e9e5;background:radial-gradient(ellipse at top,#611b31,#170b18 65%)}main{max-width:750px;margin:auto;padding:22px 14px 55px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:24px;font-weight:950;letter-spacing:3px}.tag{border:1px solid #ce7a81;border-radius:99px;padding:6px 10px;font-size:11px}h1{text-align:center;font-size:25px;margin:34px 0 8px}.subtitle{text-align:center;color:#e5bdc5;margin:0 0 22px}.notice{background:#281321;border:1px solid #633443;padding:12px;border-radius:12px;font-size:12px;color:#e4c5ca;margin:20px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.player{cursor:pointer;position:relative;border:2px solid #aa5164;background:linear-gradient(150deg,#420c24,#a42343 43%,#230b1d 80%);border-radius:16px;min-height:248px;padding:13px 10px;overflow:hidden;box-shadow:inset 0 0 0 2px #e5b47d55,0 12px 28px #0006;text-align:center;transition:transform .15s}.player:before{content:"";position:absolute;inset:7px;border:1px solid #f6bd8355;border-radius:12px;pointer-events:none}.player.selected{border-color:#ffdc91;transform:translateY(-4px);box-shadow:0 0 24px #edb87280}.player .ovr{position:absolute;top:24px;left:18px;text-align:left;font-size:27px;font-weight:900;line-height:1}.player .pos{font-size:13px}.player .portrait{font-size:70px;margin:37px 0 8px;filter:drop-shadow(0 0 12px #ffad7b66)}.player .name{font-weight:900;font-size:16px;text-transform:uppercase;position:relative;z-index:1}.player .series{font-size:10px;letter-spacing:1px;margin-top:5px;color:#ffd9ac}.player .stats{margin-top:14px;font-size:11px;border-top:1px solid #ffc2a455;padding-top:9px;display:flex;justify-content:space-around}.hidden{display:none!important}.back{background:linear-gradient(135deg,#641e34,#300d22);display:flex;align-items:center;justify-content:center;font-size:44px;color:#e9b881}.actions{display:flex;gap:10px;margin-top:24px}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:14px 16px;font-weight:800}#confirm{flex:1;background:#f4c17e;color:#351020}#confirm:disabled{opacity:.35;cursor:not-allowed}#reset{background:#4a2735;color:#fff}#result{text-align:center;margin-top:18px;color:#ffe0ac;font-weight:700}.foot{margin-top:24px;color:#bb9ca7;text-align:center;font-size:12px}@media(min-width:620px){.choices{grid-template-columns:repeat(4,1fr)}.player{min-height:260px}}
</style></head><body><main><header><div class="logo">FOOTERA</div><span class="tag">TESTVORSCHAU · NICHT LIVE</span></header><h1>CHAMPIONS PLAYER PICK</h1><p class="subtitle">Rang 1 · 1 von 4 · Aktuelles TOTW · 85+</p><div class="notice">Isolierte UI-Demo mit fiktiven Testkarten. Keine echte Ziehung, keine Vereinsgutschrift und keine Verbindung zum Live-Konto.</div><section id="choices" class="choices" aria-label="Spielerauswahl"></section><div class="actions"><button id="confirm" disabled>Spieler auswählen</button><button id="reset">Neu testen</button></div><p id="result" aria-live="polite"></p><p class="foot">Champions-Rot · dynamische Kartenakzente · nicht handelbar</p></main><script>
const players=[{name:'TOTW TEST A',ovr:85,pos:'ST',stats:'89 TEM · 84 SCH',icon:'⚽'},{name:'TOTW TEST B',ovr:87,pos:'ZM',stats:'82 PAS · 88 DRI',icon:'🏃'},{name:'TOTW TEST C',ovr:86,pos:'IV',stats:'87 DEF · 85 PHY',icon:'🛡️'},{name:'TOTW TEST D',ovr:89,pos:'TW',stats:'89 REF · 86 POS',icon:'🧤'}];let chosen=-1,locked=false,opened=false;const host=document.querySelector('#choices'),confirm=document.querySelector('#confirm'),result=document.querySelector('#result');
function render(){host.innerHTML='';players.forEach((p,i)=>{const el=document.createElement('button');el.className='player '+(chosen===i?'selected ':'')+(!opened?'back':'');el.setAttribute('aria-label',opened?p.name:'Verdeckte Spielerkarte '+(i+1));if(!opened){el.textContent='?';el.onclick=()=>reveal();}else{el.innerHTML='<div class="ovr">'+p.ovr+'<div class="pos">'+p.pos+'</div></div><div class="portrait">'+p.icon+'</div><div class="name">'+p.name+'</div><div class="series">CHAMPIONS · TOTW</div><div class="stats">'+p.stats+'</div>';el.onclick=()=>{if(!locked){chosen=i;render()}};}host.append(el)});confirm.disabled=chosen<0||locked;confirm.textContent=locked?'Auswahl bestätigt':opened?'Spieler auswählen':'Erst aufdecken'}
function reveal(){opened=true;render()}confirm.onclick=()=>{if(chosen<0||locked)return;locked=true;result.textContent='Demo-Auswahl: '+players[chosen].name+' · Keine echte Gutschrift';render()};document.querySelector('#reset').onclick=()=>{chosen=-1;locked=false;opened=false;result.textContent='';render()};render();
</script></body></html>
